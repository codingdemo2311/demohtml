<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Login Form</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: rgba(15, 23, 42, 0.72);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --primary-2: #6366f1;
      --border: rgba(148, 163, 184, 0.26);
      --input-bg: rgba(15, 23, 42, 0.45);
      --error: #f43f5e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.2), transparent 30%),
        radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.24), transparent 35%),
        linear-gradient(160deg, #020617 0%, var(--bg) 50%, #111827 100%);
    }

    .login-card {
      width: min(100%, 400px);
      backdrop-filter: blur(18px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 34px 30px;
      box-shadow: 0 16px 60px rgba(2, 6, 23, 0.6);
    }

    .title {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #cbd5e1;
      font-size: 0.88rem;
      font-weight: 500;
    }

    .input-wrap {
      position: relative;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      border: 1px solid #ffffff;
      background: var(--input-bg);
      color: var(--text);
      border-radius: 12px;
      outline: none;
      font-size: 0.95rem;
      padding: 12px 14px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input::placeholder {
      color: #64748b;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #7dd3fc;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .meta {
      margin: 10px 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 0.88rem;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #cbd5e1;
    }

    .remember input {
      accent-color: var(--primary-2);
      width: 16px;
      height: 16px;
    }

    .forgot {
      color: #7dd3fc;
      text-decoration: none;
      font-weight: 500;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .submit-btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 12px;
      color: white;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(90deg, var(--primary) 0%, var(--primary-2) 100%);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(99, 102, 241, 0.4);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .signup {
      margin-top: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .signup a {
      color: #7dd3fc;
      text-decoration: none;
      font-weight: 600;
    }

    .signup a:hover {
      text-decoration: underline;
    }

    .error {
      margin-top: 8px;
      color: var(--error);
      font-size: 0.8rem;
      min-height: 1em;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 28px 20px;
      }

      .title {
        font-size: 1.5rem;
      }

      .meta {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1 class="title">Welcome back</h1>
    <p class="subtitle">Sign in to continue to your dashboard and manage your projects.</p>

    <form novalidate>
      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <input id="email" type="email" name="email" placeholder="you@example.com" required />
        </div>
        <p class="error" id="email-error"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input id="password" type="password" name="password" placeholder="Enter your password" required minlength="8" />
          <button type="button" class="password-toggle" id="toggle-password" aria-label="Toggle password visibility">SHOW</button>
        </div>
        <p class="error" id="password-error"></p>
      </div>

      <div class="meta">
        <label class="remember" for="remember">
          <input type="checkbox" id="remember" />
          Remember me
        </label>
        <a class="forgot" href="#">Forgot password?</a>
      </div>

      <button class="submit-btn" type="submit">Sign In</button>
    </form>

    <p class="signup">Don’t have an account? <a href="#">Create one</a></p>
  </main>

  <script>
    const form = document.querySelector("form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const emailError = document.getElementById("email-error");
    const passwordError = document.getElementById("password-error");
    const togglePassword = document.getElementById("toggle-password");

    const validate = () => {
      let valid = true;

      if (!emailInput.value || !emailInput.checkValidity()) {
        emailError.textContent = "Please enter a valid email address.";
        valid = false;
      } else {
        emailError.textContent = "";
      }

      if (!passwordInput.value || passwordInput.value.length < 8) {
        passwordError.textContent = "Password must be at least 8 characters long.";
        valid = false;
      } else {
        passwordError.textContent = "";
      }

      return valid;
    };

    form.addEventListener("submit", (event) => {
      if (!validate()) {
        event.preventDefault();
      }
    });

    togglePassword.addEventListener("click", () => {
      const isHidden = passwordInput.type === "password";
      passwordInput.type = isHidden ? "text" : "password";
      togglePassword.textContent = isHidden ? "HIDE" : "SHOW";
    });
  </script>
</body>
</html>
